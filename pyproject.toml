[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = [
    { path = "tests", format = "sdist" },
]

[project]
name = "oct2py"
version = "6.1.1"
description = "'Python to GNU Octave bridge --> run m-files from python.'"
license = {text = "MIT"}
authors = [{name = "Steven Silvester", email = "steven.silvester@ieee.org"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
    "numpy >=1.25.0",
    "scipy >=1.17.1",
    # These floors terminate the Octave process when startup fails.
    "octave-kernel>=1.1.1",
    "metakernel>=1.0.6",  # imported directly by core.py
    "pydantic-settings>=2.0",
    "tornado>=6.5.5",
]
readme = "README.md"

[project.urls]
homepage = "https://github.com/blink1073/oct2py"
documentation = "https://blink1073.github.io/oct2py"

[dependency-groups]
# Every group below is kept homogeneous (all plain strings, or all
# `{ include-group = ... }` tables) rather than mixing the two in one
# array. Dependabot's toml-rb-based Poetry resolver assumes an array is a
# uniform "table array" once its first element is a table, and crashes
# (NoMethodError: undefined method 'keys' for an instance of String) on a
# later plain-string element. See dependabot/dependabot-core#14517.
dev-extra = ["pre-commit"]
dev = [{ include-group = "test" }, { include-group = "dev-extra" }]
typing-extra = ["mypy>=1.15", "ipython>=9.0", "pip"]
typing = [{ include-group = "test" }, { include-group = "typing-extra" }]
test = [
    "pytest>=9.0.3",
    "pytest-xdist",
    "flaky",
    "pandas",
    "scipy",
    "nbconvert",
    "pytest-timeout",
    "matplotlib",
    "ipython>=9.0",
]
cover-extra = ["coverage", "pytest-cov"]
cover = [{ include-group = "test" }, { include-group = "cover-extra" }]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.25,!=0.26.0",
]
bench = [
    "asv",
    "virtualenv",
]
pyinstaller = [
    # Every pyinstaller release caps its own python range, so this needs an upper bound to stay solvable.
    "pyinstaller>=6.15; python_version < '3.16'",
]


[tool.jupyter-releaser.hooks]
before-build-python = ["sudo apt-get update", "sudo apt-get install -qq octave octave-signal octave-dev"]
before-check-links = ["sudo apt-get update", "sudo apt-get install -qq octave octave-signal octave-dev"]


[tool.pytest.ini_options]
minversion = "6.0"
log_level = "INFO"
xfail_strict = true
addopts = [
  "-ra", "--durations=10", "--color=yes", "--doctest-modules",
   "--showlocals", "--strict-markers", "--strict-config",
   "--import-mode=importlib"
]
testpaths = ["tests", "tests/ipython"]
markers = [
  "needs_octave_gui: needs the GUI-linked `octave` binary; octave-cli lacks the qt graphics toolkit",
]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL"
timeout = 300
# Restore this setting to debug failures
# timeout_method = "thread"
filterwarnings= [
  # Fail on warnings
  "error",
  # Ignore our own user warnings
  "ignore:Using deprecated:UserWarning",
  "ignore:Key - value pairs:UserWarning",
  "module:Jupyter is migrating its paths:DeprecationWarning",
  "module:datetime.datetime.utcf:DeprecationWarning",
  "ignore:(?s).*Pyarrow will become a required dependency of pandas:DeprecationWarning",  # pandas pyarrow (pandas<3.0),
  "module:Parsing dates involving a day of month without a year specified:DeprecationWarning", # ipykernel
  "module:codecs.open:DeprecationWarning", # ipykernel
  # pexpect forks to spawn Octave and the issue #283 test forks a Pool; Python 3.15 warns on both.
  "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning",
]

[tool.coverage.run]
relative_files = true
source = ["oct2py"]
omit = [
  "tests/*",
]

[tool.mypy]
strict = true
disable_error_code = ["no-untyped-call", "no-untyped-def"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
pretty = true
show_error_context = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ and YTT are omitted below since ruff 0.16's default rule set already
# enables them in full; extend-select only needs to add what defaults miss.
extend-select = [
  "A", "B", "C", "E", "EM", "F", "FBT", "I", "ICN", "N",
  "PLC", "PLE", "PLR", "PLW", "Q", "RUF", "S", "SIM", "T", "TID", "UP",
  "W",
]
external = [
  "DOC",  # pydoclint
]
ignore = [
# Q000 Single quotes found but double quotes preferred
"Q000",
# FBT001 Boolean positional arg in function definition
"FBT001", "FBT002", "FBT003",
# C901 `async_setup_kernel` is too complex (12)
"C901",
# C408 Unnecessary `dict` call (rewrite as a literal)
"C408", "C409",
# Unnecessary upgrades
"UP031",
# BLE001 Do not catch blind exception - used intentionally for optional
# imports and best-effort subprocess/session cleanup throughout the codebase
"BLE001",
# TRY002 Create your own exception - single occurrence, needs a design
# decision on a dedicated exception type
"TRY002",
]

[tool.ruff.lint.per-file-ignores]
# S101 Use of `assert` detected
# N806 Variable `V` in function should be lowercase
# PLR2004 Magic value used in comparison
# SIM114 Combine `if` branches
# PLR0912 Too many branches
"tests/*" = ["S101", "N806", "PLR2004", "SIM114",
              "PLR0912", "RUF059", "E721", "PLC0415", "EM101"]
"oct2py/check.py" = ["T201"]
# pyinstaller_test scripts are standalone CLI tools — print, assert, subprocess, and magic values are intentional
"pyinstaller_test/*" = ["T201", "S101", "PLR2004", "S603"]
"*.ipynb" = ["B018", "T201", "F821"]

[tool.interrogate]
ignore-init-module=true
ignore-init-method = true
ignore-private=true
ignore-semiprivate=true
ignore-property-decorators=true
ignore-nested-functions=true
ignore-nested-classes=true
fail-under=100
exclude = ["tests", "docs", "benchmarks", "env", "results"]

[tool.repo-review]
ignore = ["PC111", "PC140", "PC170", "PY007", "PC901", "PC902", "PC903"]

[tool.pydoclint]
style = 'numpy'
arg-type-hints-in-signature = false
check-return-types = false
allow-init-docstring = true
skip-checking-raises = true
native-mode-noqa-location = "docstring"
